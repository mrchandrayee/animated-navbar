<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Floating Nav Bar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <button class="nav-item" data-label="Home">
      <i data-lucide="house"></i>
      <span>Home</span>
    </button>

    <button class="nav-item" data-label="Profile">
      <i data-lucide="user"></i>
      <span>Profile</span>
    </button>

    <button class="nav-item active" data-label="Message">
      <i data-lucide="message-circle"></i>
      <span>Message</span>
    </button>

    <button class="nav-item" data-label="Gallery">
      <i data-lucide="image"></i>
      <span>Gallery</span>
    </button>

    <button class="nav-item" data-label="Settings">
      <i data-lucide="settings"></i>
      <span>Settings</span>
    </button>
  </nav>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="script.js"></script>
</body>
</html>
